name: Halium recording correction
on:
  workflow_dispatch:
    inputs:
      full_image:
        description: Build and package the complete pinned Halium image
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare ephemeral build space and prerequisites
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h
          free=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)
          test "$free" -ge 102005473280 || { echo 'Insufficient runner space for the full Halium tree (95 GiB minimum).'; exit 1; }
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install repo build-essential gcc-multilib g++-multilib git curl python-is-python3 gperf bison flex zip unzip rsync bc lib32z1-dev libncurses5 libxml2-utils xsltproc libssl-dev file e2fsprogs
      - name: Resolve and pin the conventional generic-device manifest
        run: |
          git config --global user.name "A50 recording build"
          git config --global user.email "build@localhost"
          mkdir -p "$RUNNER_TEMP/halium" recording-test
          cd "$RUNNER_TEMP/halium"
          repo init -u https://github.com/Halium/android -b ac5d4b48f4b3b8e06fded79dfee13e0620703bad --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          printf '%s\n' '<manifest><project path="device/halium/halium_arm64" name="Halium/android_device_halium_halium_arm64" revision="halium-11.0"/><project path="vendor/vndk" name="phhusson/vendor_vndk" revision="master"/></manifest>' > .repo/local_manifests/a50-generic.xml
          repo manifest -o "$GITHUB_WORKSPACE/recording-test/resolved-manifest.xml"
          python3 "$GITHUB_WORKSPACE/scripts/experiments/pin-gsi-manifest.py" "$GITHUB_WORKSPACE/recording-test/resolved-manifest.xml" "$GITHUB_WORKSPACE/scripts/experiments/gsi1542-source-revisions.json" .repo/manifests/a50-locked.xml
          rm .repo/local_manifests/a50-generic.xml
          repo init -m a50-locked.xml
          cp .repo/manifests/a50-locked.xml "$GITHUB_WORKSPACE/recording-test/locked-manifest.xml"
      - name: Sync the pinned public sources and apply standard Halium patches
        run: |
          cd "$RUNNER_TEMP/halium"
          repo sync -c -j4 --fail-fast --no-clone-bundle --no-tags
          hybris-patches/apply-patches.sh --mb
          df -h
          if [ "${{ inputs.full_image }}" = true ]; then
            free=$(df --output=avail -B1 . | tail -1)
            test "$free" -ge 26843545600 || { echo 'Full image needs at least 25 GiB free after sync.'; exit 1; }
          fi
      - name: Build the upstream CameraRecordService guard for both architectures
        run: |
          bash scripts/experiments/build-recording-library.sh "$RUNNER_TEMP/halium" "$GITHUB_WORKSPACE/recording-test" "${{ inputs.full_image && 'full-image' || 'libraries' }}"
          test -s recording-test/lib/libaudioclient.so
          test -s recording-test/lib64/libaudioclient.so
          (cd recording-test && sha256sum -c SHA256SUMS)
      - name: Package the complete image with pinned upstream Halium tools
        if: inputs.full_image
        run: |
          set -euo pipefail
          git clone --no-checkout https://gitlab.com/ubports/porting/community-ports/jenkins-ci/halium-build-tools.git "$RUNNER_TEMP/halium-tools"
          git -C "$RUNNER_TEMP/halium-tools" checkout --detach 9ace25eaf6e71aa38a1e18f94019b19f92d547e9
          test "$(git -C "$RUNNER_TEMP/halium-tools" rev-parse HEAD)" = 9ace25eaf6e71aa38a1e18f94019b19f92d547e9
          git -C "$RUNNER_TEMP/halium-tools" rev-parse HEAD > recording-test/packaging-tools.commit
          sudo mkdir -p /opt/halium_build
          test ! -e /opt/halium_build/11.0
          sudo ln -s "$RUNNER_TEMP/halium" /opt/halium_build/11.0
          cd "$RUNNER_TEMP/halium"
          mkdir out/target/product/halium_arm64/images
          mv out/target/product/halium_arm64/*.img out/target/product/halium_arm64/images/
          # Use the built native sparse-image tool; no extra Android SDK download.
          export PATH="$PWD/out/host/linux-x86/bin:$PATH"
          bash "$RUNNER_TEMP/halium-tools/build-tarball.sh" halium_arm64 "$GITHUB_WORKSPACE/recording-test" 11.0 true false
          cd "$GITHUB_WORKSPACE/recording-test"
          tar -xOf halium_halium_arm64.tar.xz system/var/lib/lxc/android/android-rootfs.img > "$RUNNER_TEMP/a50-gsi-candidate.img"
          e2fsck -fn "$RUNNER_TEMP/a50-gsi-candidate.img"
          for arch in lib lib64; do
            debugfs -R "dump /system/$arch/libaudioclient.so $RUNNER_TEMP/a50-image-$arch.so" "$RUNNER_TEMP/a50-gsi-candidate.img"
            cmp "$RUNNER_TEMP/a50-image-$arch.so" "$arch/libaudioclient.so"
          done
          sha256sum "$RUNNER_TEMP/a50-gsi-candidate.img" | sed 's|  .*|  android-rootfs.img|' > ANDROID_ROOTFS_SHA256SUM
          stat -c%s "$RUNNER_TEMP/a50-gsi-candidate.img" > ANDROID_ROOTFS_BYTES
          sha256sum halium_halium_arm64.tar.xz ramdisk-recovery.img > IMAGE_SHA256SUMS
          sha256sum -c IMAGE_SHA256SUMS
      - name: Preserve artifacts and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recording-library-test
          path: recording-test/
          if-no-files-found: warn
          retention-days: 7
