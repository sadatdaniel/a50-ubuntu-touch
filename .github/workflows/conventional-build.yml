name: Conventional UBports device build

# Mirrors UBports' community-port CI (halium-generic-adaptation-build-tools
# gsi-port-ci.yml): Ubuntu 22.04, its package list, then the build.sh wrapper,
# which pins the tools. Builds kernel, boot and recovery from deviceinfo.
on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Test override for deviceinfo_kernel_source_branch (empty = deviceinfo)
        type: string
        default: ''
      kernel_defconfig:
        description: Test override for deviceinfo_kernel_defconfig (empty = deviceinfo)
        type: string
        default: ''
      clang:
        description: Test override 'BRANCH REVISION' for the tools' Google clang (empty = deviceinfo)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    steps:
      - name: Install the UBports CI package list
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            fakeroot flex git kmod libelf-dev libssl-dev libtinfo5 lz4 python2 python3 sudo unzip wget \
            xz-utils pahole libbpf-dev
          ln -sf python2 /usr/bin/python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply test overrides (CI copy only)
        if: inputs.kernel_branch != '' || inputs.kernel_defconfig != '' || inputs.clang != ''
        env:
          KB: ${{ inputs.kernel_branch }}
          KD: ${{ inputs.kernel_defconfig }}
          CL: ${{ inputs.clang }}
        run: |
          [ -z "$KB" ] || sed -i "s|^deviceinfo_kernel_source_branch=.*|deviceinfo_kernel_source_branch=\"$KB\"|" deviceinfo
          [ -z "$KD" ] || sed -i "s|^deviceinfo_kernel_defconfig=.*|deviceinfo_kernel_defconfig=\"$KD\"|" deviceinfo
          if [ -n "$CL" ]; then
            set -- $CL
            sed -i "s|^deviceinfo_kernel_clang_branch=.*|deviceinfo_kernel_clang_branch=\"$1\"|; s|^deviceinfo_kernel_clang_revision=.*|deviceinfo_kernel_clang_revision=\"$2\"|" deviceinfo
          fi
          grep -E '^deviceinfo_kernel_(source_branch|defconfig|clang_branch|clang_revision)=' deviceinfo
      - name: Build with the pinned adaptation tools
        run: ./build.sh
      - name: Keep early-boot compile commands (toolchain bisect)
        run: |
          cd workdir/downloads/KERNEL_OBJ
          find . -name '.main.o.cmd' -path '*/init/*' -o -name '.setup.o.cmd' -path '*/arm64/kernel/*' -o -name '.head.o.cmd' -path '*/arm64/kernel/*' -o -name '.mmu.o.cmd' -path '*/arm64/mm/*' -o -name '.printk.o.cmd' -path '*/printk/*' | tar -czf "$GITHUB_WORKSPACE/out/kernel-cmds.tar.gz" -T -
      - name: Report outputs
        run: |
          ls -la out/
          (cd out && sha256sum * 2>/dev/null) | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: conventional-build
          path: out/
          retention-days: 30
