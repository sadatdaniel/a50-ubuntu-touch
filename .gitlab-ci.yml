# UBports community-port CI (used once the repo lives in
# gitlab.com/ubports/porting/community-ports). The shared pipeline builds the
# kernel, boot/recovery and device tarball with halium-generic-adaptation-build-tools.
include:
  - https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/raw/main/gsi-port-ci.yml

variables:
  # Use this repo's build.sh, which pins the adaptation tools to a tested commit.
  ADAPTATION_TOOLS_USE_BUILD_WRAPPER: 1
