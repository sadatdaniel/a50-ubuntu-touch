# The Halium GSI this port ships, pinned.
#
# WHY THIS FILE EXISTS. build-rootfs-image.sh used to fetch the GSI from
# Jenkins' `lastSuccessfulBuild`, which moves. Measured, three days apart:
#
#   build 1545  2026-09-08  131801132 bytes
#   build 1544  2026-09-07  131800908
#   build 1543  2026-09-06  131801180
#   build 1542  2026-09-05  131801268   <- what the 2026-09-06 releases ship
#
# It rebuilds daily and the artifact changes every time. Unpinned, two builds
# of this port a week apart contain different Android systems with nothing
# recording which - so a regression with an unchanged kernel and rootfs had no
# third suspect to rule out.
#
# Moving GSI_BUILD is a real change: rebuild, reflash, boot-test, then commit
# with the evidence. `--gsi-build latest` fetches the newest and prints its
# hash so the pin can be moved deliberately; it never moves it for you.

# Jenkins job: UBportsCommunityPortsJenkinsCI /
#   ubports/porting/community-ports/jenkins-ci/generic_arm64 / halium-11.0
GSI_JOB=https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-11.0
GSI_BUILD=1542
GSI_DATE=2026-09-05

# sha256 of halium_halium_arm64.tar.xz as downloaded.
GSI_SHA256=48ed0fd15c3b6b3a29de2b683c511ab9fb54f148b6e25556dbe6a1767fb6d2a3

# sha256 of the file that tarball actually installs, at
# /var/lib/lxc/android/android-rootfs.img. This is the one checkable on a
# running device:
#     sha256sum /var/lib/lxc/android/android-rootfs.img
GSI_ANDROID_ROOTFS_SHA256=e53c4d7fe5beec7e641b1c7eb998cfb117eed934078b913fe610d964f194bc98
GSI_ANDROID_ROOTFS_BYTES=473772032
