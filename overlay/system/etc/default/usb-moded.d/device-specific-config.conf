# Samsung Galaxy A50 native USB cable detection.
# Read through the packaged usb-moded EnvironmentFile/configurator interface.
# Requires the validated USB supply notification and DWC3 pull-up state fixes
# (aa17 descendant); see docs/experiments/049-usb-native-cable-detection.md.
# Preserve normal Developer Mode authorization; disable packaged rescue mode
# and the old assume-always-connected workaround. No polling or restart hook.
USB_MODED_ARGS=""
USB_MODED_HW_ADAPTATION_ARGS=""

# Manufacturer/product use the existing vendor-property autodetection.
# USB vendor/product identifiers remain a separate release validation item;
# do not introduce untested identities as part of the cable correction.
