# usb-moded configuration for the Samsung Galaxy A50 (a50).
#
# Read by /usr/libexec/ubports-usb-moded-configurator, which runs as
# usb-moded.service's ExecStartPre. This is the file the shipped copy tells
# porters to overlay, and it is where the reference community port
# (gitlab.com/uports/h10/oneplus-nord-n100) puts its USB configuration too.

# THIS DEVICE HAS NO WORKING USB CABLE DETECTION.
#
# usb-moded decides at startup whether a PC is attached and then does not
# re-evaluate. Boot with the cable already plugged in and it stays convinced
# nothing is there:
#
#   usb_moded: Mode 'developer_mode' requested while not connected to pc
#
# so the gadget keeps whatever configuration it had at boot - on this device a
# bare mass_storage function - and there is no RNDIS and no ADB over USB. The
# host sees only "SAMSUNG File-Stor Gadget" and no network adapter, which looks
# exactly like a dead cable.
#
# Restarting usb-moded with the cable in works around it, because that makes it
# sample the current state. -f is the real fix: usb_moded --help offers it as
# "assume always connected", for precisely this case.
#
# Verified 2026-09-08 across a reboot with the cable attached: rndis0 comes up
# with 10.15.19.82/24 on its own, rndis.usb0 is linked into configs/c.1, and
# the host gets a DHCP lease from the phone - no manual restart.
USB_MODED_HW_ADAPTATION_ARGS="-f"

# NOT SET, and it should be. The configurator falls back to pid.codes test IDs
# (1209:0002-0005) and its own comment says a port is not "done" until real
# ones are set, because Windows is likelier to enumerate a device with
# plausible IDs. Left alone here because changing them is an untested variable
# and USB currently works; revisit with a host-side enumeration test.
#
# IDVENDOR=...
# IDPRODUCT_MTP=...
# IDPRODUCT_MTP_ADB=...
# IDPRODUCT_RNDIS=...
# IDPRODUCT_RNDIS_ADB=...
#
# MANUFACTURER and PRODUCT are left to autodetection - the configurator reads
# them from ro.product.vendor.manufacturer / ro.product.vendor.model, which on
# this device give "samsung" and "SM-A505F".
