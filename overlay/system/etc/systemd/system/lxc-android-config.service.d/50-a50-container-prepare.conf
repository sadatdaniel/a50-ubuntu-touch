# Pull in and order a50-container-prepare.service.  It has to run after the
# Android partitions are mounted (it reads /android/vendor and /android/system)
# and before the container starts (its output is bound in by mount.sh, which
# runs in the container's own mount namespace).
[Unit]
Wants=a50-container-prepare.service
After=a50-container-prepare.service
