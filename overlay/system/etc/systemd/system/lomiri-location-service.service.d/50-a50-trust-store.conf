# Allow location sessions to be created on a port with no kernel AppArmor.
#
# lomiri-location-service resolves every client's AppArmor profile before it
# will open a session (Skeleton::DBusDaemonCredentialsResolver, via
# libapparmor). This kernel has no AppArmor, so that resolution fails and
# CreateSessionForCriteria returns com.lomiri.location.Service.Error
# .CreatingSession -- every location request is refused, GPS included.
#
# TrustStorePermissionManager checks this variable first and grants before it
# ever looks at the profile, so the whole path is skipped. It is the same
# switch lxc-android-config's own lomiri-location-serviced-wrapper sets from
# the Android property custom.location.testing; setting it here does not
# depend on an Android property surviving in the container.
#
# Trade-off, deliberate: this grants location to any client without the
# trust-store prompt. On this port nothing is confined anyway -- there is no
# AppArmor, so no app is isolated by it -- and the alternative is that
# location works for nobody. Remove this file to restore the prompt once a
# kernel with AppArmor boots.
#
# See docs/experiments/009-gps-permissions.md.
[Service]
Environment=TRUST_STORE_PERMISSION_MANAGER_IS_RUNNING_UNDER_TESTING=1
