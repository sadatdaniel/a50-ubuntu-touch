# Let fingerprint enrollment work on a port with no kernel AppArmor.
#
# biometryd gates every operation (enroll, identify, clear) behind an AppArmor
# credentials check on the D-Bus caller: biometry::dbus::skeleton::
# DaemonCredentialsResolver resolves the peer's AppArmor profile through
# libapparmor via GetConnectionCredentials. This kernel has no AppArmor, so
# that resolution fails and every call is refused with
#
#     com.ubports.biometryd.Error.NotPermitted
#
# That error is also what crashes System Settings: the fingerprint page throws
# it as an uncaught std::runtime_error and the whole app dies with SIGABRT the
# moment you open Security & Privacy -> Fingerprint.
#
# BIOMETRYD_DBUS_SKELETON_IS_RUNNING_UNDER_TESTING makes the skeleton's request
# verifier permit the call before it ever tries to resolve a profile. It is the
# exact analogue of TRUST_STORE_PERMISSION_MANAGER_IS_RUNNING_UNDER_TESTING for
# lomiri-location-service (see docs/experiments/009-gps-permissions.md) and is
# the same trade-off: on a port with no AppArmor nothing is confined anyway, so
# there is no isolation being given up - the alternative is that fingerprint
# works for nobody and Settings crashes. Remove this once a kernel with
# AppArmor boots.
#
# See docs/experiments/012-fingerprint.md.
[Service]
Environment=BIOMETRYD_DBUS_SKELETON_IS_RUNNING_UNDER_TESTING=1
