# Waydroid's Android starts android.hardware.camera.provider@2.4-service, which
# crash-loops here (Android init restarts it every 5 s) because the A50 camera
# does not work under Waydroid. Waydroid's /system/etc/init/init.waydroid.rc
# defines that service with `override`. Android 11 init rejects a vendor .rc
# overriding it ("overrides another service across the treble boundary"), and an
# empty vendor .rc changes nothing (both tested). So this .rc goes in the same
# directory through Waydroid's supported system overlay (mount_overlays, on by
# default). init parses that directory in sorted order, so the zz- prefix makes
# this definition the last one: disabled and without the interface line, so
# neither class start nor an on-demand interface request can launch it.
# /var/lib/waydroid is a persistent userdata path, so the rootfs cannot ship this
# file directly; this rule recreates it on every boot.
# See docs/experiments/061-waydroid-camera-overlay.md.
d /var/lib/waydroid/overlay 0755 root root -
d /var/lib/waydroid/overlay/system 0755 root root -
d /var/lib/waydroid/overlay/system/etc 0755 root root -
d /var/lib/waydroid/overlay/system/etc/init 0755 root root -
f+ /var/lib/waydroid/overlay/system/etc/init/zz-a50-nocamera.rc 0644 root root - service vendor.camera-provider-2-4 /vendor/bin/hw/android.hardware.camera.provider@2.4-service\n    override\n    disabled\n
