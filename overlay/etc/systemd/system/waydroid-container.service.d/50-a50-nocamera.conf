# Stop Waydroid's camera provider once the container is up - it crash-loops on
# this device (restarting every ~6 s) because the camera does not work here.
#
# Backgrounded deliberately. The helper waits for sys.boot_completed inside the
# container, which takes longer than systemd's TimeoutStartSec; running it
# synchronously makes waydroid-container.service report
# "Job ... failed because a timeout was exceeded" even though the container
# started correctly. The leading "-" also keeps any failure non-fatal.
#
# See /usr/local/bin/a50-waydroid-nocamera.sh and
# docs/experiments/013-waydroid.md.
[Service]
ExecStartPost=-/bin/sh -c '/usr/local/bin/a50-waydroid-nocamera.sh >/dev/null 2>&1 &'
