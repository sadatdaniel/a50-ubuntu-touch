# Stop Waydroid's camera provider once the container is up - it crash-loops on
# this device, restarting every ~6 s, because the camera does not work here.
# See /usr/local/bin/a50-waydroid-nocamera.sh and
# docs/experiments/013-waydroid.md.
[Service]
ExecStartPost=/usr/local/bin/a50-waydroid-nocamera.sh
