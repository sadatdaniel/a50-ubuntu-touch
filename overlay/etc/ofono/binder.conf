# ofono-binder-plugin config for the Galaxy A50 (SM-A505F), dual SIM.
#
# path is required per slot - binder_plugin.c returns Missing path for slot
# without it - and the upstream convention is the ril prefix
# (BINDER_DEFAULT_SLOT_PATH_PREFIX), i.e. /ril_0, /ril_1.
#
# radioInterface matters here: the plugin defaults to 1.2
# (android.hardware.radio@1.2::IRadio) and this device does not serve that.
# lshal inside the container registers only
#     android.hardware.radio@1.0::IRadio/slot1 and /slot2
#     android.hardware.radio@1.0 through @1.4 ::IRadio/slot1 and /slot2
# and 1.4 is the highest available.
[Settings]
signalStrengthRange = -120,-75
ExpectSlots = slot1,slot2

[slot1]
path = /ril_0
slot = slot1
radioInterface = 1.4

[slot2]
path = /ril_1
slot = slot2
radioInterface = 1.4

# The plugin maps dBm to a percentage linearly between these two values, and
# returns a hardcoded 1 for anything at or below the low end:
#
#     return (dbm <= min_dbm) ? 1 : ... (binder_netreg_percent_from_dbm)
#
# Its defaults are -100 dBm weak / -60 dBm strong, which suit RSSI, not the
# LTE RSRP this modem reports. Idle RSRP here is -107..-112 dBm - below the
# -100 floor - so the indicator sat at 1% and showed no bars, and only came
# alive during a call when the value rose above -100.
#
# -120..-75 dBm is the usual usable RSRP span: -120 is no service, about -75
# is excellent.
