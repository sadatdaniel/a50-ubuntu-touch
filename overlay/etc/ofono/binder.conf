# ofono-binder-plugin config for the Galaxy A50 (SM-A505F), dual SIM.
#
# path is required per slot - binder_plugin.c returns Missing path for slot
# without it - and the upstream convention is the ril prefix
# (BINDER_DEFAULT_SLOT_PATH_PREFIX), i.e. /ril_0, /ril_1.
#
# radioInterface matters here: the plugin defaults to 1.2
# (android.hardware.radio@1.2::IRadio) and this device does not serve that.
# lshal inside the container registers only
#     android.hardware.radio@1.0::IRadio/slot1 and /slot2
#     android.hardware.radio@1.0 through @1.4 ::IRadio/slot1 and /slot2
# and 1.4 is the highest available.
[Settings]
ExpectSlots = slot1,slot2

[slot1]
path = /ril_0
slot = slot1
radioInterface = 1.4

[slot2]
path = /ril_1
slot = slot2
radioInterface = 1.4
