# Samsung Galaxy A50 (SM-A505F) — 1080x2340, 6.4", ro.sf.lcd_density=420
#
# Without a device config the session falls back to generic.conf's
# GRID_UNIT_PX=8 and the shell renders far too small, with the indicators and
# battery pushed into the screen corners.
#
# Ubuntu Touch's grid unit is 8dp at mdpi, so for this panel:
#   GRID_UNIT_PX = 8 * (420 / 160) = 21
#
# Upstream ships this path as an empty placeholder that the initrd bind-mounts
# over; on this device it is a plain file, so setting it here is what takes
# effect. See docs/experiments/006-what-we-missed.md section 3.
GRID_UNIT_PX=21
QTWEBKIT_DPR=2.625
NATIVE_ORIENTATION=portrait
FORM_FACTOR=phone
